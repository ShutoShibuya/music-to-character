# キャラクターのパーツ設定。
#
# 変換の流れ:
#   1. sources の各印象 v について、direction が negative なら t_i = 1 - v、positive なら t_i = v
#   2. combine で t_i を合成して t (0〜1) を得る
#        mean          : 単純平均 (初期実装)
#        weighted_mean : weights を使った重み付き平均 (将来用。weights は sources と同順)
#   3. 値 = min + t * (max - min)
#
# 印象ID: 1=激しい(0)〜穏やか(1)  2=明るい(0)〜暗い(1)  3=安定(0)〜緊迫(1)  4=軽い(0)〜重い(1)
#         5=壮大(0)〜こじんまり(1) 6=感情豊か(0)〜淡々(1) 7=シンプル(0)〜複雑(1) 8=おしゃれ(0)〜素朴(1)
#
# ★ direction / min / max は暫定値。描画(ステップ6)で見た目を確認しながら調整する。
#   label: 画面表示用の日本語名
#   unit の意味: ratio = 標準を1.0とする倍率 / deg = 度 / unit = 0〜1 の強さ / count = 個数
parts:
  # ---------- 顔 ----------
  eye_brow_distance:   # 目と眉間の距離: 穏やかなほど離れる
    label: 目と眉間の距離
    group: face
    unit: ratio
    sources: [{impression: 1, direction: positive}]
    combine: mean
    min: 0.5
    max: 1.5
  cheek_intensity:     # ほっぺの色の濃さ: 明るく感情豊かなほど濃い
    label: ほっぺの色の濃さ
    group: face
    unit: unit
    sources: [{impression: 2, direction: negative}, {impression: 6, direction: negative}]
    combine: mean
    min: 0.0
    max: 1.0
  eye_angle:           # 目の角度(正=外側が上がる=つり目): 激しいほどつり目
    label: 目の角度
    group: face
    unit: deg
    sources: [{impression: 1, direction: negative}]
    combine: mean
    min: -15
    max: 15
  brow_angle:          # 眉の角度(正=内側が下がる=怒り眉): 激しい・緊迫ほど怒り眉
    label: 眉の角度
    group: face
    unit: deg
    sources: [{impression: 1, direction: negative}, {impression: 3, direction: positive}]
    combine: mean
    min: -10
    max: 25
  brow_thickness:      # 眉の太さ: 激しい・重い・素朴ほど太い
    label: 眉の太さ
    group: face
    unit: ratio
    sources:
      - {impression: 1, direction: negative}
      - {impression: 4, direction: positive}
      - {impression: 8, direction: positive}
    combine: mean
    min: 0.5
    max: 2.0
  brow_shortness:      # 眉の短さ: おしゃれほど短い
    label: 眉の短さ
    group: face
    unit: unit
    sources: [{impression: 8, direction: negative}]
    combine: mean
    min: 0.0
    max: 1.0
  mouth_corner:        # 口角(正=上がる): 明るいほど上がる
    label: 口角
    group: face
    unit: unit
    sources: [{impression: 2, direction: negative}]
    combine: mean
    min: -1.0
    max: 1.0
  eye_highlight:       # 目のハイライト: 明るく感情豊かなほど強い
    label: 目のハイライト
    group: face
    unit: unit
    sources: [{impression: 2, direction: negative}, {impression: 6, direction: negative}]
    combine: mean
    min: 0.0
    max: 1.0
  eye_height:          # 目の縦幅: 明るく感情豊かなほど大きい
    label: 目の縦幅
    group: face
    unit: ratio
    sources: [{impression: 2, direction: negative}, {impression: 6, direction: negative}]
    combine: mean
    min: 0.6
    max: 1.4
  eye_spacing:         # 目と目の間の距離: 重く淡々としているほど離れる
    label: 目と目の間の距離
    group: face
    unit: ratio
    sources: [{impression: 4, direction: positive}, {impression: 6, direction: positive}]
    combine: mean
    min: 0.8
    max: 1.3
  outline_roundness:   # 輪郭の形状(0=角張る, 1=丸い): 穏やかで安定しているほど丸い
    label: 輪郭の形状
    group: face
    unit: unit
    sources: [{impression: 1, direction: positive}, {impression: 3, direction: negative}]
    combine: mean
    min: 0.0
    max: 1.0

  # ---------- 体 ----------
  body_lightness:      # 体の色の明度: 明るいほど高い
    label: 体の色の明度
    group: body
    unit: unit
    sources: [{impression: 2, direction: negative}]
    combine: mean
    min: 0.25
    max: 0.9
  body_saturation:     # 体の色の彩度: 軽いほど高い
    label: 体の色の彩度
    group: body
    unit: unit
    sources: [{impression: 4, direction: negative}]
    combine: mean
    min: 0.2
    max: 0.9
  body_width:          # 体の横幅: 重い・素朴ほど広い
    label: 体の横幅
    group: body
    unit: ratio
    sources: [{impression: 4, direction: positive}, {impression: 8, direction: positive}]
    combine: mean
    min: 0.8
    max: 1.3
  body_height:         # 体の縦幅: 壮大ほど高い
    label: 体の縦幅
    group: body
    unit: ratio
    sources: [{impression: 5, direction: negative}]
    combine: mean
    min: 0.7
    max: 1.3
  body_texture:        # 体の質感(0=なめらか, 1=ざらざら): 複雑ほど粗い
    label: 体の質感
    group: body
    unit: unit
    sources: [{impression: 7, direction: positive}]
    combine: mean
    min: 0.0
    max: 1.0

  # ---------- その他 ----------
  mouth_openness:      # 口の開き具合: 感情豊かなほど開く
    label: 口の開き具合
    group: other
    unit: unit
    sources: [{impression: 6, direction: negative}]
    combine: mean
    min: 0.0
    max: 1.0
  effect_count:        # エフェクトの数: 複雑・おしゃれほど多い
    label: エフェクトの数
    group: other
    unit: count
    sources: [{impression: 7, direction: positive}, {impression: 8, direction: negative}]
    combine: mean
    min: 0
    max: 8
    integer: true
  decoration_amount:   # 装飾の多さ: おしゃれほど多い
    label: 装飾の多さ
    group: other
    unit: count
    sources: [{impression: 8, direction: negative}]
    combine: mean
    min: 0
    max: 10
    integer: true
