# 特徴量抽出のパラメータ(音声読込に関するものは audio.yaml)。
# ★ 暫定値。実際の楽曲で確認しながら調整する。
melody:                          # C. メロディ
  max_gap_sec: 1.0               # 音符間の無音がこれを超えたら別のフレーズとし、その間の音程は旋律の動きに数えない
  leap_threshold_semitones: 5    # この半音数以上の音程差を「跳躍」とする(5 = 完全4度)
  ngram_length: 4                # 旋律の繰り返し判定に使う音程列の長さ
  smoothness_ref_semitones: 7    # 滑らかさ = 1 - 平均|音程の変化量| / この値 (0〜1 にクリップ)
  min_notes: 8                   # これ未満の音符数ならメロディ特徴を計算しない(失敗として扱う)

chroma:                          # A・G 共通のクロマ(音名ごとのエネルギー)計算
  hpss: false                    # true で打楽器成分を除いてから計算する(精度は上がるが 120 秒の曲で約16秒余計にかかる)

key:                             # A. 調
  min_correlation: 0.5           # キープロファイルとの最大相関がこれ未満なら「調を判定できない」として失敗にする
                                 # (打楽器やノイズ主体の入力でも相関が高く出ることがあるため、確信度 confidence も併せて見ること)

chord:                           # G. コード
  window_sec: 0.25               # コードを判定する時間窓(秒)
  switch_penalty: 0.3            # コードを切り替えるときのペナルティ(大きいほど細かい切り替わりを抑える)
  min_similarity: 0.7            # テンプレートとの類似度がこれ未満の窓は「コードなし」とする(音名が一様なノイズでも 4 和音テンプレートは約 0.58 になる)
  silence_ratio: 0.05            # 窓のエネルギーが最大窓のこの割合未満なら無音(コードなし)とする
  min_chord_ratio: 0.2           # コードが判定できた窓の割合がこれ未満ならコード特徴を失敗にする
  extended_penalty: 0.05         # 三和音(maj/min)以外のコードの類似度から引く値(ノイズで7thなどに誤判定されるのを防ぐ)
  complexity:                    # 複雑さ = 重み付き平均(重みは合計が1でなくてよい)
    extension: 0.5               #   三和音以外のコードが占める時間の割合
    type_variety: 0.25           #   使われたコード種類の多さ ((種類数-1)/(type_ref-1))
    chord_variety: 0.25          #   使われた異なるコードの数の多さ ((数-1)/(chord_ref-1))
    type_ref: 4                  #   type_variety が 1 になる種類数
    chord_ref: 8                 #   chord_variety が 1 になるコード数

articulation:                    # H. アーティキュレーション
  decay_threshold_db: -20        # 発音後、RMS がピークからこれだけ下がったら「音が減衰した」とみなす(dB, 負の値)
  gap_threshold_db: -30          # 基準レベル(RMS の95%タイル)よりこれ以上低いフレームを「切れ目(無音)」とする(dB, 負の値)
  onset_context_frames: 2        # 発音点の直前この数のフレームを見て、発音ではなく音の減衰かどうかを判定する
  onset_decay_ratio: 0.7         # 発音点の RMS が直前の最大 RMS のこの割合未満なら、音の終わり(減衰)として除外する(0〜1)
  min_onsets: 4                  # 発音点がこれ未満ならアーティキュレーションを評価しない(失敗として扱う)
