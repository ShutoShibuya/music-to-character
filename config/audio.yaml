# 音声読込・前処理・音高解析の設定
sample_rate: 22050        # librosa の標準。読込時にリサンプルする
min_duration_sec: 3.0     # これより短い音声は分析不可として拒否する
max_duration_sec: 120.0   # これより長い場合は中央部分のみ分析する(処理時間の上限)
trim_top_db: 40.0         # 前後の無音トリムの閾値(dB)
peak_normalize: true      # ピーク正規化(RMS 等を曲間で比較可能にする)
fmin_hz: 65.41            # 音高推定の下限 (C2)
fmax_hz: 2093.0           # 音高推定の上限 (C7)
frame_length: 2048        # RMS・オンセット等の分析フレーム長(サンプル)
hop_length: 512           # 分析フレームのホップ長(サンプル)
pitch_min_voiced_ratio: 0.05   # 有声(音高が取れた)フレームの割合がこれ未満なら音高系の特徴量を失敗にする
pitch_range_percentile: 2.0    # 音域の最大/最小は上下この%を除いたパーセンタイルで求める(0 で真の最大/最小)
pitch_max_transition_rate: 100.0   # pyin が1秒間に許す音高変化の上限(オクターブ/秒)。librosa 既定は 35.92 だが、
                                    # 約10半音を超える跳躍に追従できず跳躍の多い旋律で音を取りこぼすため引き上げている
pitch_min_note_frames: 4         # この長さ(フレーム)未満の音高の塊は音符とみなさず、音の切り替わり・誤検出として捨てる
